<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Login - SecureAuth</title>
<!-- Tailwind CSS CDN with Forms Plugin -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Google Fonts: Plus Jakarta Sans & Outfit -->

<script data-purpose="tailwind-config">
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            display: ['"Outfit"', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#fff7ed',
              100: '#ffedd5',
              200: '#fed7aa',
              300: '#fdba74',
              400: '#fb923c',
              500: '#f97316',
              600: '#ea580c',
              700: '#c2410c',
              dark: '#2c1e19',
            },
            mascot: {
              cream: '#fbe9db',
              bead: '#5c3a21',
              robe: '#ff6720',
              leaf: '#b4d33c',
            }
          },
          boxShadow: {
            'glass': '0 20px 50px -12px rgba(234, 88, 12, 0.12), 0 8px 24px -4px rgba(0, 0, 0, 0.04)',

          keyframes: {
            float: {
              '0%, 100%': { transform: 'translateY(0px) rotate(0deg)' },

            leafSway: {
              '0%, 100%': { transform: 'translateY(0px) rotate(0deg)' },
              '50%': { transform: 'translateY(-8px) rotate(12deg)' },
            },
            wingFlapLeft: {
              '0%, 100%': { transform: 'rotate(-4deg)' },
              '50%': { transform: 'rotate(2deg)' },
            },
            wingFlapRight: {
              '0%, 100%': { transform: 'rotate(4deg)' },
              '50%': { transform: 'rotate(-2deg)' },
            }

            'sway-leaf': 'leafSway 4s ease-in-out infinite',

<style data-purpose="custom-background-and-depth">
    /* Subtle Clay/3D depth gradients mirroring reference */
    .bg-peach-glow {
      background: radial-gradient(circle at 65% 45%, #fedecb 0%, #fbd5bd 35%, #fce2d0 70%, #f7d6be 100%);
    }
    
    .glass-backdrop-panel {
      background: rgba(255, 255, 255, 0.28);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border: 1.5px solid rgba(255, 255, 255, 0.65);
    }

    .form-card-glass {
      background: rgba(255, 255, 255, 0.72);
      backdrop-filter: blur(32px);
      -webkit-backdrop-filter: blur(32px);
      border: 1px solid rgba(255, 255, 255, 0.95);
    }

    /* 3D clay effect on beads and character parts */
    .clay-surface {
      background: linear-gradient(145deg, #fff0e2 0%, #f8cfb5 100%);
      box-shadow: inset -6px -6px 14px rgba(199, 120, 80, 0.35), inset 6px 6px 14px rgba(255, 255, 255, 0.9);
    }

    .robe-gradient {
      background: linear-gradient(135deg, #ff7a2b 0%, #ea580c 60%, #c2410c 100%);
      box-shadow: inset 4px 4px 10px rgba(255, 210, 180, 0.4), inset -8px -8px 16px rgba(130, 35, 0, 0.35);
    }

    .bead-item {
      background: radial-gradient(circle at 35% 30%, #875738 0%, #523118 60%, #351c0b 100%);
      box-shadow: 2px 5px 8px rgba(70, 30, 10, 0.45), inset 1px 2px 3px rgba(255, 255, 255, 0.4);
    }
  </style>
</head>
<body class="min-h-screen bg-peach-glow text-gray-800 flex items-center justify-center p-3 sm:p-6 md:p-10 font-sans relative overflow-x-hidden selection:bg-brand-200 selection:text-brand-700">
<!-- Ambient background decorative floating orbs mirroring composition -->
<div class="fixed -bottom-24 -left-24 w-96 h-96 rounded-full bg-[#f8be9a]/40 blur-3xl pointer-events-none -z-10"></div>
<div class="fixed top-12 right-20 w-80 h-80 rounded-full bg-[#fedcc5]/60 blur-2xl pointer-events-none -z-10"></div>
<!-- BEGIN: MainContainer -->
<!-- Outer Frosted Stage matching the wide backdrop glass container in the reference -->
<main class="w-full max-w-6xl glass-backdrop-panel rounded-[36px] sm:rounded-[48px] p-4 sm:p-8 lg:p-12 shadow-2xl relative overflow-hidden my-auto" data-purpose="authentication-stage">
<div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-center relative z-10">
<!-- BEGIN: LeftAuthenticationCard -->
<section class="lg:col-span-5 w-full flex justify-center" data-purpose="login-form-wrapper">
<div class="w-full max-w-md form-card-glass rounded-[32px] p-6 sm:p-9 shadow-glass relative">
<!-- Brand Logo Header -->

<div class="flex items-center gap-2.5">
<div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-brand-600 to-brand-400 flex items-center justify-center shadow-md text-white font-bold text-lg">

</div>
<div>

</div>
</div>

<!-- Sign-in Form -->
<form action="#" class="space-y-4" data-purpose="login-form" method="POST" onsubmit="event.preventDefault();">
<!-- Email Input Field -->
<div>
<label class="block text-xs font-semibold text-stone-700 mb-1.5 ml-1" for="email">Email</label>
<div class="relative">

<span class="absolute right-3.5 top-1/2 -translate-y-1/2 text-stone-400 text-sm pointer-events-none">

</div>
</div>
<!-- Password Input Field -->
<div>
<label class="block text-xs font-semibold text-stone-700 mb-1.5 ml-1" for="password">Password</label>
<div class="relative">
<input class="w-full bg-white/90 border border-stone-200/90 rounded-2xl py-3 px-4 pr-11 text-sm text-stone-800 placeholder-stone-400 focus:outline-none focus:ring-2 focus:ring-brand-500/40 focus:border-brand-500 transition-all shadow-sm" id="password" name="password" placeholder="••••••••••••" required="" type="password" value="SecretPassword123"/>
<button aria-label="Toggle password visibility" class="absolute right-3.5 top-1/2 -translate-y-1/2 text-stone-400 hover:text-stone-700 transition-colors p-1" id="togglePassword" type="button">

</div>
</div>
<!-- Form Helpers (Forgot Password) -->

<label class="flex items-center gap-2 cursor-pointer select-none text-stone-600 hover:text-stone-900">
<input checked="" class="w-4 h-4 rounded text-brand-600 focus:ring-brand-500 border-stone-300" type="checkbox"/>
<span>Remember me</span>
</label>
<a class="font-medium text-stone-600 hover:text-brand-600 transition-colors" href="#">Forgot Password?</a>
</div>
<!-- Submit Button -->
<div class="pt-1">
<button class="w-full bg-gradient-to-r from-brand-500 via-orange-500 to-brand-600 hover:from-brand-600 hover:to-orange-600 text-white font-semibold py-3.5 px-6 rounded-2xl shadow-btn hover:shadow-lg active:scale-[0.99] transition-all duration-200 flex items-center justify-center gap-2 group text-sm sm:text-base cursor-pointer" type="submit">

<!-- Google -->

<path d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.33 24 12 24z" fill="#34A853"></path>
<path d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.16 0 9.94 0 12s.45 3.84 1.25 5.42l4.03-3.15z" fill="#FBBC05"></path>
<path d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.33 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z" fill="#EA4335"></path>
</svg>
</button>
<!-- GitHub -->

<i class="fa-brands fa-facebook-f text-base"></i>
</button>
</div>
<!-- Registration Footer Prompt -->
<div class="mt-6 text-center">

</p>
</div>
</div>

<!-- BEGIN: InteractiveScripts -->
<!-- Password visibility toggle interaction -->
<script data-purpose="password-visibility-handler">
    document.addEventListener('DOMContentLoaded', () => {
      const togglePasswordBtn = document.getElementById('togglePassword');
      const passwordInput = document.getElementById('password');
      const toggleIcon = document.getElementById('toggleIcon');

      if (togglePasswordBtn && passwordInput && toggleIcon) {
        togglePasswordBtn.addEventListener('click', () => {
          const isPassword = passwordInput.getAttribute('type') === 'password';
          passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
          
          if (isPassword) {
            toggleIcon.classList.remove('fa-eye-slash');
            toggleIcon.classList.add('fa-eye');
          } else {
            toggleIcon.classList.remove('fa-eye');
            toggleIcon.classList.add('fa-eye-slash');
          }
        });
      }
    });
  </script>
<!-- END: InteractiveScripts -->
